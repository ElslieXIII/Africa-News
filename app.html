<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Africa News</title>
<meta name="description" content="Demo of Africa News, a phone-first reader for African business, deal and tech news.">
<script src="demo/demo-runtime.js"></script>
<script>if(window.self!==window.top)document.documentElement.classList.add("embedded");</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column — sticky masthead, a "stories" rail of sources, a vertical card feed, fixed 4-tab bar, bottom sheet for folders. */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#15181D; --muted:#5F6671; --line:#DCDFE4; --chip:#E7EAEE;
  --accent:#0E6B5C; --on-accent:#FFFFFF; --gold:#B7791F; --cover-ink:#FFFFFF; --danger:#B4232C; --scrim:rgba(10,12,16,.48);
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --tabbar-h:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1013; --surface:#171A1F; --ink:#ECEEF1; --muted:#9AA1AC; --line:#272B32; --chip:#22262D;
    --accent:#3FB59B; --on-accent:#08201B; --gold:#E3A43A; --cover-ink:#FFFFFF; --danger:#F06A72; --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#171A1F; --ink:#ECEEF1; --muted:#9AA1AC; --line:#272B32; --chip:#22262D;
  --accent:#3FB59B; --on-accent:#08201B; --gold:#E3A43A; --cover-ink:#FFFFFF; --danger:#F06A72; --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 28px);
  -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:520px;margin:0 auto}

/* Masthead */
.masthead{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);
  display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:16px 12px}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-0.02em;margin:0;line-height:1}
.wordmark span{color:var(--accent)}
.stamp{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;text-align:right;background:none;border:0;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.stamp:hover{text-decoration:underline;text-underline-offset:3px}
.stamp svg{width:13px;height:13px;flex:0 0 auto}
.stamp.running svg{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rnote{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.rnote p{margin:0;font-size:14.5px;max-width:60ch}

/* Stories rail */
.rail{display:flex;gap:14px;overflow-x:auto;padding-block:6px 14px;margin-bottom:6px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.rail::-webkit-scrollbar{display:none}
.story{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;background:none;border:0;padding:0;cursor:pointer}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;background:var(--line);display:grid;place-items:center;transition:transform .15s}
.story[aria-pressed="true"] .ring{background:var(--ring,var(--accent))}
.story:hover .ring{transform:scale(1.04)}
.dot{width:100%;height:100%;border-radius:50%;border:2px solid var(--bg);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--cover-ink);background:var(--c,var(--ink))}
.dot.all{background:var(--ink);color:var(--bg);font-size:13px;font-family:var(--f-mono);font-weight:500}
.story-label{font-size:11.5px;color:var(--muted);max-width:68px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.story[aria-pressed="true"] .story-label{color:var(--ink);font-weight:600}

/* Feed cards */
.feed{display:flex;flex-direction:column;gap:22px;padding-top:14px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.post-head{display:flex;align-items:center;gap:10px;padding:10px 12px}
.avatar{width:34px;height:34px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--cover-ink);background:var(--c)}
.who{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.who b{font-weight:600;font-size:14px}
.who small{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--chip);color:var(--muted);padding:4px 8px;border-radius:999px;white-space:nowrap}

.cover{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;
  aspect-ratio:1/1;max-width:100%;padding:22px 22px 20px;text-decoration:none;color:var(--cover-ink);
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(255,255,255,.16), transparent 55%),
    linear-gradient(180deg, transparent 40%, rgba(0,0,0,.28)),
    var(--c);
  overflow:hidden}
.cover:focus-visible{outline-offset:-4px;outline-color:var(--cover-ink)}
.ghost{position:absolute;right:-.06em;top:-.22em;font-family:var(--f-display);font-weight:800;font-size:220px;line-height:1;
  color:var(--cover-ink);opacity:.09;pointer-events:none;letter-spacing:-0.04em;user-select:none}
.cover-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;position:relative}
.kicker{border:1px solid rgba(255,255,255,.55);padding:4px 8px;border-radius:4px}
.date{text-align:right;line-height:1.15;opacity:.9}
.date strong{display:block;font-family:var(--f-display);font-size:28px;letter-spacing:-0.02em;font-weight:800}
.headline{position:relative;margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(23px,6.3vw,33px);
  line-height:1.07;letter-spacing:-0.015em;text-wrap:balance;
  display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.readhint{position:relative;font-family:var(--f-mono);font-size:11px;opacity:.85;margin-top:10px;display:flex;gap:6px;align-items:center}

/* Newsletter card: a ruled "letter" cover, shorter than an article cover */
.letter{position:relative;display:flex;flex-direction:column;gap:14px;min-height:210px;padding:20px 22px;text-decoration:none;color:var(--cover-ink);
  background:
    repeating-linear-gradient(180deg, transparent 0 27px, rgba(255,255,255,.08) 27px 28px),
    radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.14), transparent 55%),
    var(--c);
  overflow:hidden}
.letter:focus-visible{outline-offset:-4px;outline-color:var(--cover-ink)}
.postmark{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.92}
.postmark .stampbox{border:1.5px dashed rgba(255,255,255,.6);border-radius:4px;padding:3px 7px}
.letter .headline{font-size:clamp(22px,5.8vw,30px);-webkit-line-clamp:5;margin-top:auto}
.inside{margin:0;padding:4px 16px 4px 34px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;max-width:65ch}
.inside li::marker{color:var(--accent)}
.inside-label{padding:12px 16px 0;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.actions{display:flex;align-items:center;gap:4px;padding:8px 6px 2px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;
  font-size:13.5px;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.act:hover{background:var(--chip)}
.act svg{width:20px;height:20px;flex:0 0 auto}
.act.read{color:var(--accent)}
.act.save[aria-pressed="true"]{color:var(--gold)}
.act.save[aria-pressed="true"] svg path{fill:currentColor}
.act.save .fname{max-width:9em;overflow:hidden;text-overflow:ellipsis}
.act.save.pop svg{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.35)}100%{transform:scale(1)}}
.act.copy{margin-left:auto;color:var(--muted)}
.caption{padding:2px 16px 16px;font-size:14.5px;max-width:65ch;margin:0}
.caption b{font-weight:600}
.post .inside + .caption, .post .inside{padding-bottom:16px}

/* Sections */
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:18px 4px}
.section-head h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;letter-spacing:-0.01em;min-width:0;overflow-wrap:anywhere}
.section-head span{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted);margin-top:16px}
.empty h3{font-family:var(--f-display);color:var(--ink);font-size:19px;margin:0 0 6px}
.empty p{margin:0 auto;max-width:42ch}
.skeleton{height:420px;border-radius:14px;background:linear-gradient(90deg,var(--chip),var(--surface),var(--chip));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.end{text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:8px 0}

/* Saved: folder grid */
.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-top:12px}
.ftile{display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:1/1;max-width:100%;width:100%;
  border-radius:12px;overflow:hidden;background:var(--line);border:1px solid var(--line)}
.mosaic i{display:grid;place-items:center;background:var(--c,var(--chip));font-style:normal;font-family:var(--f-display);font-weight:800;color:var(--cover-ink);font-size:20px}
.mosaic.blank i{background:var(--chip);color:var(--muted)}
.mosaic.new{grid-template-columns:1fr;grid-template-rows:1fr;background:transparent;border:1.5px dashed var(--line)}
.mosaic.new i{background:transparent;color:var(--muted);font-family:var(--f-body);font-weight:400;font-size:40px}
.ftile:hover .mosaic{border-color:var(--muted)}
.fname-row{display:flex;flex-direction:column;gap:1px;min-width:0}
.fname-row b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fname-row small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.backbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:14px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 8px 6px 0;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500}
.back:hover{color:var(--ink)}
.toolrow{display:flex;gap:6px;flex-wrap:wrap}
.inline-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:10px}
.inline-form input{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.notice{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.notice p{margin:0;font-size:14px}

/* Sources */
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;margin-top:12px;max-width:100%}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg small{font-family:var(--f-mono);font-size:11px;margin-left:4px;opacity:.75}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px}
.src{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.src:first-child{border-top:0}
.src .meta{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.src .meta b{font-weight:600}
.src .meta a,.src .meta .addr{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .meta a:hover{text-decoration:underline}
.src .meta .about{font-size:13px;color:var(--muted)}
.pill{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;padding:3px 8px;border-radius:999px;white-space:nowrap;align-self:flex-start;margin-top:2px}
.pill.live{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.wait{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--chip)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.confirm{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
form.add{display:flex;flex-direction:column;gap:12px;padding:16px}
form.add h3{margin:0;font-family:var(--f-display);font-size:18px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.field input:focus,.inline-form input:focus,.sheet input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{font-size:13px;color:var(--danger);margin:0}

/* Bottom sheet: save to folder */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:min(82vh,640px);overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -12px 40px rgba(0,0,0,.2);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head h3{margin:0;font-family:var(--f-display);font-size:20px}
.sheet-head p{margin:2px 0 0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.x{border:0;background:var(--chip);width:32px;height:32px;border-radius:50%;cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
.flist{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line)}
.frow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer;text-align:left}
.frow:hover{background:color-mix(in srgb,var(--chip) 60%,transparent)}
.frow .mosaic{width:44px;height:44px;border-radius:9px;flex:0 0 auto}
.frow .mosaic i{font-size:12px}
.frow .fname-row{flex:1}
.frow .tick{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 auto;color:var(--on-accent)}
.frow[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent)}
.frow.newrow{color:var(--accent);font-weight:600}
.frow.newrow .mosaic{border-style:dashed}
.newform{display:flex;flex-direction:column;gap:8px;padding:14px 0 4px}
.newform label{font-size:12.5px;font-weight:600;color:var(--muted)}
.newform .row{display:flex;gap:8px;flex-wrap:wrap}
.newform input{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.sheet-foot{display:flex;justify-content:space-between;gap:8px;padding-top:14px;flex-wrap:wrap}

/* Reader: full-screen, reading measure ~65ch */
.reader{position:fixed;inset:0;z-index:22;background:var(--bg);overflow:auto;overscroll-behavior:contain}
.reader-bar{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.reader-bar-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.reader-bar .who{flex:1}
.reader-in{max-width:680px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.reader-kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.reader h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.08;letter-spacing:-0.015em;margin:8px 0 14px;text-wrap:balance}
.r-actions{display:flex;gap:4px;flex-wrap:wrap;margin:0 -10px 18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.r-body{font-size:17px;line-height:1.62;max-width:65ch;overflow-wrap:anywhere}
.r-body p{margin:0 0 14px}
.r-body h3{font-family:var(--f-display);font-size:20px;line-height:1.2;margin:26px 0 8px}
.r-body ul{margin:0 0 14px;padding-left:22px}
.r-body li{margin-bottom:6px}
.r-body a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
.r-body a.ext{font-family:var(--f-mono);font-size:12px;text-decoration:none;padding:0 2px}
.r-note{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.r-note p{margin:0}
.r-skel{height:14px;border-radius:6px;margin:0 0 12px;background:linear-gradient(90deg,var(--chip),var(--surface),var(--chip));background-size:200% 100%;animation:sh 1.4s linear infinite}
button.letter,button.cover{font:inherit;text-align:left;border:0;cursor:pointer;width:100%}
.r-body .lede{font-size:18px;line-height:1.55}
.r-body .brief-note{font-size:13px;color:var(--muted);margin-top:24px;padding-top:12px;border-top:1px solid var(--line)}
.r-cta{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.r-cta .btn{text-decoration:none;padding:10px 14px;font-size:14px}

/* Ideas */
.tab .ico{position:relative;display:inline-flex}
.tab .ico .badge{position:absolute;top:-5px;left:14px;margin:0;line-height:15px;min-width:15px;text-align:center}
.act.idea[aria-pressed="true"]{color:var(--accent)}
.tchip{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;background:color-mix(in srgb,var(--tc) 18%,transparent);color:color-mix(in srgb,var(--tc) 70%,var(--ink))}
.tchip svg{width:22px;height:22px}
.tpill{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--tc) 16%,transparent);color:color-mix(in srgb,var(--tc) 70%,var(--ink));white-space:nowrap}
.isheet-existing{display:flex;flex-direction:column;gap:8px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
.isheet-existing .toolrow .btn{white-space:normal;text-align:left}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{font-family:var(--f-mono);margin-left:5px;opacity:.75}
.ideas{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.idea-card{display:flex;flex-direction:column;gap:6px;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;width:100%}
.idea-card:hover{border-color:var(--muted)}
.idea-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.idea-top small{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.idea-card h3{margin:2px 0 0;font-family:var(--f-display);font-size:19px;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.idea-src,.idea-prev{margin:0;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.idea-src{font-size:13px;color:var(--muted);-webkit-line-clamp:1}
.idea-prev{font-size:14px;-webkit-line-clamp:2}
.idea-foot{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.idea-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tsel{font:inherit;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;max-width:100%}
.idea-name{display:block;width:100%;border:0;background:transparent;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1.12;letter-spacing:-0.01em;resize:none;padding:4px 0 6px;margin:8px 0 14px;overflow:hidden}
.idea-name:focus{outline:none;box-shadow:inset 0 -2px 0 var(--accent)}
.idea-link{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.idea-link .meta{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:2px}
.idea-link small{font-size:12px;color:var(--muted)}
.idea-link b{font-weight:600;font-size:14px;line-height:1.3}
.idea-sec{font-family:var(--f-display);font-size:19px;margin:26px 0 8px}
.idea-notes{display:block;width:100%;min-height:150px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.55;resize:none;overflow:hidden}
.idea-notes:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.steps{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.step{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line)}
.step input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto;margin:0}
.step-text,.step-add input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-size:15px;padding:8px 0}
.step-text:focus,.step-add input:focus{outline:none;box-shadow:inset 0 -1px 0 var(--accent)}
.step.done .step-text{text-decoration:line-through;color:var(--muted)}
.step-x{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:6px;flex:0 0 auto}
.step-x svg{width:16px;height:16px}
.step-x:hover{background:var(--chip)}
.step-add{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px}
.step-plus{width:18px;text-align:center;color:var(--muted);font-size:18px;flex:0 0 auto}
.idea-status{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.idea-del{margin-top:30px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* Read state */
.post.is-read{opacity:.55;filter:grayscale(.75);transition:opacity .2s ease,filter .2s ease}
.post.is-read:hover,.post.is-read:focus-within{opacity:.85;filter:grayscale(.3)}
.read-divider{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:6px}
.read-divider::before,.read-divider::after{content:"";flex:1;height:1px;background:var(--line)}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar nav{max-width:520px;margin:0 auto;height:var(--tabbar-h);display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;min-width:0}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg path{stroke-width:2.3}
.badge{font-family:var(--f-mono);font-size:10px;font-weight:500;background:var(--gold);color:var(--surface);border-radius:999px;padding:0 5px;margin-left:3px;font-variant-numeric:tabular-nums}
.unread-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.unread-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;font-size:13px;color:var(--muted)}
.unread-bar b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:500;cursor:pointer;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 14px);
  z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:min(440px,calc(100vw - 32px));
  box-shadow:0 8px 24px rgba(0,0,0,.18)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.demo-flag{max-width:520px;margin:10px auto 0;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--chip);border-radius:8px;padding:6px 10px;text-align:center}
.demo-flag a{color:var(--accent)}
.embedded .demo-flag{display:none}

<script>
(function(){
  const PALETTE=["#1F5C4A","#8A2E3B","#24457A","#6B4E16","#4B3A78","#0F5E73","#7A3A1A","#3E5A24","#5A2D5E","#2F4858","#8C4A12","#1D4E6B","#6E2C2C","#374151","#2E3B55","#7A5C00"];
  const CHUNK=10;
  const WINDOW_DAYS=14;
  const fresh=(iso)=>{const t=Date.parse(iso);return !isNaN(t)&&Date.now()-t<=WINDOW_DAYS*864e5;};
  const S={db:null,dbState:"waiting",
    sources:new Map(),articles:[],issues:[],saved:new Map(),folders:new Map(),meta:null,reads:new Map(),readMark:{},ideas:new Map(),ideaTypes:new Map(),ideaFilter:"all",
    loaded:{sources:false,articles:false,issues:false,saved:false,folders:false,ideas:false,ideaTypes:false},
    view:"feed",filter:"all",nlFilter:"all",shown:CHUNK,srcTab:"website",
    folder:null,folderMode:null,confirm:null,formErr:"",stale:false,sheet:null};
  const main=document.getElementById("main");
  let io=null, lastFocus=null;

  // ---------- helpers ----------
  function h(tag,attrs,...kids){
    const el=document.createElement(tag);
    if(attrs) for(const [k,v] of Object.entries(attrs)){
      if(v==null||v===false) continue;
      if(k==="class") el.className=v;
      else if(k==="style") el.setAttribute("style",v);
      else if(k.startsWith("on")) el.addEventListener(k.slice(2),v);
      else el.setAttribute(k,v===true?"":v);
    }
    for(const k of kids.flat()){ if(k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); }
    return el;
  }
  const svg=(d)=>{const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");s.setAttribute("fill","none");s.setAttribute("aria-hidden","true");s.innerHTML=d;return s;};
  const ICON={
    read:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    mail:'<path d="M3.8 6.2h16.4v11.6H3.8zM4.2 6.6l7.8 6.2 7.8-6.2" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    web:'<path d="M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17zM3.5 12h17M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5c-2.3-2.4-3.4-5.2-3.4-8.5s1.1-6.1 3.4-8.5z" stroke="currentColor" stroke-width="1.6"/>',
    save:'<path d="M6 3.8h12v17l-6-4.2-6 4.2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    copy:'<path d="M9 9h10v11H9zM5 15V4h10" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
    x:'<path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    tick:'<path d="M5 12.5l4.2 4.2L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>',
    back:'<path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
    idea:'<path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2v.2h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'
  };
  function monogram(name){
    const w=String(name||"?").replace(/[^A-Za-z0-9 ]/g," ").trim().split(/\s+/).filter(Boolean);
    if(!w.length) return "?";
    return (w.length===1?w[0].slice(0,2):(w[0][0]+w[1][0])).toUpperCase();
  }
  function domain(u){try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return u||"";}}
  const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function ago(iso){
    const t=Date.parse(iso); if(isNaN(t)) return "";
    const m=Math.round((Date.now()-t)/60000);
    if(m<1) return "just now"; if(m<60) return m+"m ago";
    const hr=Math.round(m/60); if(hr<24) return hr+"h ago";
    const d=Math.round(hr/24); if(d<7) return d+"d ago";
    const dt=new Date(t); return dt.getDate()+" "+MON[dt.getMonth()]+(dt.getFullYear()!==new Date().getFullYear()?" "+dt.getFullYear():"");
  }
  function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"x";}
  const rid=()=>Math.random().toString(36).slice(2,6);
  let toastTimer=null;
  function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},3200);}
  const kindOf=(s)=>s&&s.kind==="newsletter"?"newsletter":"website";
  function srcOf(it){return S.sources.get(it.sourceId)||{name:it.sourceName||"Unknown",color:"#2F4858",url:""};}
  function itemsById(){
    const m=new Map();
    S.articles.forEach(a=>m.set(a.id,{kind:"article",item:a}));
    S.issues.forEach(n=>m.set(n.id,{kind:"newsletter",item:n}));
    return m;
  }
  const titleOf=(e)=>e.kind==="newsletter"?e.item.subject:e.item.title;
  function folderName(fid){const f=fid&&S.folders.get(fid);return f?f.name:"Unsorted";}
  function savedEntries(){
    const by=itemsById();
    return [...S.saved.values()]
      .map(s=>{const e=by.get(s.itemId)||(s.item?{kind:s.kind||"article",item:Object.assign({},s.item,{id:s.itemId})}:null);return e?Object.assign({save:s},e):null;})
      .filter(Boolean)
      .sort((x,y)=>String(y.save.savedAt).localeCompare(String(x.save.savedAt)));
  }
  // ---------- read state: opened items + "mark all read" watermarks ----------
  const itemDate=(kind,it)=>kind==="newsletter"?it.receivedAt:it.publishedAt;
  function isRead(kind,it){
    if(S.reads.has(it.id)) return true;
    const mark=S.readMark&&S.readMark[kind==="newsletter"?"newslettersBefore":"feedBefore"];
    return !!(mark&&String(itemDate(kind,it))<=mark);
  }
  function freshList(kind){
    const ids=new Set([...S.sources].filter(([,s])=>kindOf(s)===(kind==="newsletter"?"newsletter":"website")).map(([id])=>id));
    return (kind==="newsletter"?S.issues:S.articles).filter(x=>ids.has(x.sourceId)&&fresh(itemDate(kind,x)));
  }
  const unreadCount=(kind)=>freshList(kind).filter(x=>!isRead(kind,x)).length;
  async function markRead(kind,it){
    if(!S.db||!it||!it.id||isRead(kind,it)) return;
    const doc={kind,at:new Date().toISOString()};
    S.reads.set(it.id,doc); setTabs();
    try{ await S.db.collection("reads").doc(it.id).set(doc); }
    catch(e){ S.reads.delete(it.id); setTabs(); }
  }
  async function markAllRead(kind){
    if(!S.db) return;
    const key=kind==="newsletter"?"newslettersBefore":"feedBefore";
    const latest=freshList(kind).map(x=>String(itemDate(kind,x))).sort().pop();
    if(!latest) return;
    const prev=Object.assign({},S.readMark);
    S.readMark=Object.assign({},S.readMark,{[key]:latest}); render();
    try{ await S.db.doc("meta/read").set(S.readMark); toast("Marked all as read"); }
    catch(e){ S.readMark=prev; render(); toast("Couldn't mark all as read. Try again."); }
  }
  function unreadBar(kind){
    const n=unreadCount(kind);
    if(!n) return null;
    return h("div",{class:"unread-bar"},h("span",null,h("b",null,String(n))," unread"),
      h("button",{class:"linkbtn",type:"button",onclick:()=>markAllRead(kind)},"Mark all as read"));
  }
  const inFolder=(e,fid)=>fid==="all"?true:fid==="unsorted"?!(e.save.folderId&&S.folders.has(e.save.folderId)):e.save.folderId===fid;

  // ---------- shared pieces ----------
  function saveButton(kind,item){
    const s=S.saved.get(item.id);
    return h("button",{class:"act save",type:"button","aria-pressed":s?"true":"false",
      "aria-label":s?"Saved in "+folderName(s.folderId)+". Change folder":"Save to a folder",
      onclick:(e)=>openSheet(kind,item,e.currentTarget)},
      svg(ICON.save),h("span",{class:"fname"},s?folderName(s.folderId):"Save"));
  }
  function copyButton(url){return h("button",{class:"act copy",type:"button","aria-label":"Copy link",onclick:()=>copyLink(url)},svg(ICON.copy),"Copy");}

  function articleCard(a){
    const s=srcOf(a); const c=s.color||"#2F4858"; const d=new Date(a.publishedAt);
    return h("article",{class:"post"+(isRead("article",a)?" is-read":""),style:"--c:"+c},
      h("div",{class:"post-head"},
        h("div",{class:"avatar"},monogram(s.name)),
        h("div",{class:"who"},h("b",null,s.name,isRead("article",a)?null:h("span",{class:"unread-dot","aria-label":"Unread"})),h("small",null,ago(a.publishedAt))),
        a.country?h("span",{class:"where"},a.country):null),
      h("button",{class:"cover",type:"button","aria-label":"Read briefing: "+a.title,onclick:(e)=>openArticle(a,e.currentTarget)},
        h("div",{class:"ghost","aria-hidden":"true"},monogram(s.name)),
        h("div",{class:"cover-top"},
          a.tag?h("span",{class:"kicker"},a.tag):h("span"),
          isNaN(d)?null:h("span",{class:"date"},h("strong",null,String(d.getDate()).padStart(2,"0")),MON[d.getMonth()]+" "+d.getFullYear())),
        h("div",null,h("h2",{class:"headline"},a.title),h("div",{class:"readhint"},(a.brief?"Read briefing":"Read in app")+" →"))),
      h("div",{class:"actions"},
        h("button",{class:"act read",type:"button",onclick:(e)=>openArticle(a,e.currentTarget)},svg(ICON.read),"Read"),
        saveButton("article",a), ideaButton("article",a), copyButton(a.url)),
      a.summary?h("p",{class:"caption"},h("b",null,s.name+" "),a.summary):null);
  }

  function issueCard(n){
    const s=srcOf(n); const c=s.color||"#2F4858"; const d=new Date(n.receivedAt);
    const when=isNaN(d)?"":d.getDate()+" "+MON[d.getMonth()]+" · "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
    const open=n.gmailUrl||n.webUrl;
    const hl=Array.isArray(n.highlights)?n.highlights.filter(Boolean):[];
    return h("article",{class:"post"+(isRead("newsletter",n)?" is-read":""),style:"--c:"+c},
      h("div",{class:"post-head"},
        h("div",{class:"avatar"},monogram(s.name)),
        h("div",{class:"who"},h("b",null,s.name,isRead("newsletter",n)?null:h("span",{class:"unread-dot","aria-label":"Unread"})),h("small",null,ago(n.receivedAt)+(s.about?" · "+s.about:""))),
        h("span",{class:"where"},"Newsletter")),
      h("button",{class:"letter",type:"button","aria-label":"Read in app: "+n.subject,onclick:(e)=>openReader(n,e.currentTarget)},
        h("div",{class:"postmark"},h("span",{class:"stampbox"},n.tag||"Issue"),h("span",null,when)),
        h("h2",{class:"headline"},n.subject),
        h("div",{class:"readhint"},"Read in app →")),
      h("div",{class:"actions"},
        h("button",{class:"act read",type:"button",onclick:(e)=>openReader(n,e.currentTarget)},svg(ICON.mail),"Read"),
        n.webUrl?h("a",{class:"act read",href:n.webUrl,target:"_blank",rel:"noopener noreferrer"},svg(ICON.web),"Web"):null,
        saveButton("newsletter",n), ideaButton("newsletter",n), copyButton(n.webUrl||n.gmailUrl)),
      n.summary?h("p",{class:"caption"},h("b",null,s.name+" "),n.summary):null,
      hl.length?h("div",{class:"inside-label"},"In this issue"):null,
      hl.length?h("ul",{class:"inside"},hl.map(x=>h("li",null,x))):null);
  }

  async function createFolder(raw,inSheet){
    const name=String(raw||"").trim().replace(/\s+/g," ");
    const fail=(m)=>{if(inSheet&&S.sheet){S.sheet.err=m;renderSheet();document.getElementById("sheet-folder")?.focus();}else{S.formErr=m;render();}return null;};
    if(!name) return fail("Give the folder a name.");
    for(const f of S.folders.values()) if(f.name.toLowerCase()===name.toLowerCase()) return fail("You already have a folder called “"+f.name+"”.");
    const id=slug(name)+"-"+rid();
    const doc={name,createdAt:new Date().toISOString()};
    S.folders.set(id,doc);
    if(inSheet&&S.sheet) S.sheet.busy=true;
    try{ await S.db.collection("folders").doc(id).set(doc); S.formErr=""; return id; }
    catch(err){
      S.folders.delete(id); if(S.sheet) S.sheet.busy=false;
      return fail(err&&err.code==="invalid_argument"?"Only the owner can create folders here.":"Couldn't create the folder. Try again in a moment.");
    }
  }
  async function saveTo(folderId){
    const sh=S.sheet; if(!sh) return;
    const it=sh.item, prev=S.saved.get(it.id);
    if(prev&&prev.folderId===folderId){closeSheet();return;}
    const copy=Object.assign({},it); delete copy.id;
    const doc={itemId:it.id,kind:sh.kind,folderId,savedAt:prev?prev.savedAt:new Date().toISOString(),item:copy};
    S.saved.set(it.id,doc);
    const fname=folderName(folderId);
    closeSheet(); render();
    try{ await S.db.collection("saved").doc(it.id).set(doc); toast((prev?"Moved to ":"Saved to ")+fname); }
    catch(e){
      if(prev) S.saved.set(it.id,prev); else S.saved.delete(it.id);
      render(); toast(e&&e.code==="invalid_argument"?"Only the owner can save here.":"Couldn't save. Check your connection and try again.");
    }
  }
  async function unsave(){
    const sh=S.sheet; if(!sh) return;

  async function createIdeaType(raw){

    const id="t-"+slug(name)+"-"+rid(); const doc={name,createdAt:new Date().toISOString()};
    S.ideaTypes.set(id,doc); if(S.isheet) S.isheet.busy=true;

  // ---------- refresh: on tap, starts John's "Africa News refresh" scheduled task ----------
  function openRefresh(){

    lastFocus=document.getElementById("stamp");
    S.rsheet={busy:false,err:null};

  }
  function closeRefresh(){
    S.rsheet=null; const root=document.getElementById("sheetRoot"); root.hidden=true; root.replaceChildren();
    if(!S.reader&&!S.areader&&!S.ideaEdit) document.body.classList.remove("locked");
    if(lastFocus&&document.contains(lastFocus)) lastFocus.focus(); lastFocus=null;
  }
  const REFRESH_ERR={
    no_mcp:"Refreshing works when this page is open in Claude while you're signed in.",
    approval_required:"Claude needs your OK for this page to start the refresh.",
    not_in_manifest:"Starting refreshes is turned off for this page. Turn on Claude Code Remote in this page's permissions.",
    server_not_connected:"The connection Claude uses to run refreshes isn't available right now. Ask Claude in chat to refresh instead.",
    needs_reauth:"Your Claude connection needs reconnecting. Reload the page and try again.",
    blocked_by_policy:"Your organisation's settings don't allow this page to start a refresh. Ask Claude in chat instead.",
    tool_error:"The refresh task couldn't be started. It may have been deleted or paused. Ask Claude in chat to set it up again."
  };
  function renderRefreshSheet(first){
    const root=document.getElementById("sheetRoot"); const r=S.rsheet;
    if(!r){root.hidden=true;root.replaceChildren();return;}
    const running=refreshRunning();
    const btns=[];
    if(r.err==="not_in_manifest") btns.push(h("button",{class:"btn primary",type:"button",onclick:openPermissions},"Open permissions"));
    btns.push(h("button",{class:"btn primary",type:"button",id:"refresh-go",disabled:r.busy||null,onclick:doRefresh},r.busy?"Starting…":(r.err==="approval_required"?"Allow and refresh":(running?"Refresh again":"Refresh now"))));
    btns.push(h("button",{class:"btn",type:"button",onclick:closeRefresh},"Cancel"));
    const dlg=h("div",{class:"sheet",role:"dialog","aria-modal":"true","aria-labelledby":"refresh-title",onclick:(e)=>e.stopPropagation()},
      h("div",{class:"grab","aria-hidden":"true"}),
      h("div",{class:"sheet-head"},h("h3",{id:"refresh-title"},running?"A refresh is already running":"Do you want to refresh?"),
        h("button",{class:"x",type:"button","aria-label":"Close",onclick:closeRefresh},svg(ICON.x))),
      h("div",{class:"rnote"},
        h("p",null,running
          ?"Claude started a refresh at "+hhmm(new Date(S.meta.requestedAt))+". New items appear as they're added. You only need to start another if this one looks stuck."
          :"Claude will check every website and your Gmail newsletters, add anything new with a briefing, and clear items older than 14 days. It usually takes 10–20 minutes, and you can keep using the app while it runs."),
        S.meta&&S.meta.lastRefresh&&!running?h("p",{class:"hint"},"Last refreshed "+new Date(S.meta.lastRefresh).getDate()+" "+MON[new Date(S.meta.lastRefresh).getMonth()]+" at "+hhmm(new Date(S.meta.lastRefresh))+"."):null,
        r.err?h("p",{class:"err",role:"alert"},REFRESH_ERR[r.err]||"Couldn't start the refresh. Try again in a moment."):null,
        h("div",{class:"toolrow"},btns)));
    root.replaceChildren(h("div",{class:"scrim",onclick:closeRefresh},dlg)); root.hidden=false;
    if(first) (dlg.querySelector("#refresh-go")||dlg.querySelector(".x")).focus();
  }
  async function doRefresh(){
    const r=S.rsheet; if(!r||r.busy) return;
    r.busy=true; r.err=null; renderRefreshSheet();
    const mcp=await getMcp();
    if(!mcp){r.busy=false;r.err="no_mcp";renderRefreshSheet();return;}
    try{
      await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:REFRESH_TASK},{cache:false});
    }catch(e){
      if(S.rsheet){S.rsheet.busy=false;S.rsheet.err=(e&&e.code)||"upstream_error";renderRefreshSheet();}
      return;
    }
    const prev=S.meta;
    const next=Object.assign({},S.meta||{},{status:"running",requestedAt:new Date().toISOString()});
    S.meta=next; S.watchRefresh=true; setStamp();
    closeRefresh();
    toast("Refresh started. New items appear as Claude adds them.");
    try{ await S.db.doc("meta/feed").set(next); }catch(e){ /* the refresh still runs; the stamp updates when it finishes */ }
  }

  async function writeSource(id,doc,okMsg,btnId,clearIds){
    const btn=document.getElementById(btnId); if(btn) btn.disabled=true;
    try{
      await S.db.collection("sources").doc(id).set(doc);
      clearIds.forEach(i=>{const el=document.getElementById(i); if(el) el.value="";});
      S.formErr=""; toast(okMsg);
    }catch(err){
      S.formErr=err&&err.code==="invalid_argument"?"Only the owner can add sources.":(err&&err.code==="quota_exceeded"?"The app is full. Remove a source first.":"Couldn't add the source. Try again in a moment.");
      render();
    }finally{const b=document.getElementById(btnId); if(b) b.disabled=false;}
  }
  async function addWebsite(e){
    e.preventDefault();
    const name=document.getElementById("src-name").value.trim(); let url=document.getElementById("src-url").value.trim();
    S.formErr="";
    if(!name){S.formErr="Give the website a name.";render();document.getElementById("src-name").focus();return;}
    if(!url){S.formErr="Add the site's address or its RSS feed link.";render();document.getElementById("src-url").focus();return;}
    if(!/^https?:\/\//i.test(url)) url="https://"+url;
    let parsed; try{parsed=new URL(url);if(!parsed.hostname.includes("."))throw 0;}catch(_){S.formErr="That address doesn't look like a website. Try something like moneyweb.co.za.";render();return;}
    const dom=domain(parsed.href);
    for(const s of S.sources.values()) if(kindOf(s)==="website"&&domain(s.url)===dom){S.formErr=s.name+" already uses "+dom+".";render();return;}
    if(!S.db){S.formErr="Adding sources needs the Claude app.";render();return;}
    await writeSource(slug(name)+"-"+rid(),{kind:"website",name,url:parsed.href,color:nextColor(),status:"pending",addedAt:new Date().toISOString()},
      name+" added. Its articles arrive on the next refresh.","src-add",["src-name","src-url"]);
  }
  async function addNewsletter(e){
    e.preventDefault();
    const name=document.getElementById("nl-name").value.trim(); const sender=document.getElementById("nl-sender").value.trim().toLowerCase().replace(/^mailto:/,"");
    S.formErr="";
    if(!name){S.formErr="Give the newsletter a name.";render();document.getElementById("nl-name").focus();return;}
    if(!sender){S.formErr="Add the address the newsletter comes from, or its domain.";render();document.getElementById("nl-sender").focus();return;}
    if(!/^([^\s@]+@)?[a-z0-9-]+(\.[a-z0-9-]+)+$/.test(sender)){S.formErr="That doesn't look like an email address or domain. Try newsletter@example.com or example.com.";render();return;}
    for(const s of S.sources.values()) if((s.senders||[]).includes(sender)){S.formErr=s.name+" already uses "+sender+".";render();return;}
    if(!S.db){S.formErr="Adding sources needs the Claude app.";render();return;}
    await writeSource(slug(name)+"-"+rid(),{kind:"newsletter",name,senders:[sender],color:nextColor(),status:"pending",addedAt:new Date().toISOString()},
      name+" added. Claude pulls its issues on the next refresh.","nl-add",["nl-name","nl-sender"]);
  }
  async function removeSource(id){
    S.confirm=null;
    const name=S.sources.get(id)?.name||"Source";
    try{await S.db.collection("sources").doc(id).delete(); toast(name+" removed");}
    catch(e){toast("Couldn't remove "+name+".");render();}
  }

  // ---------- routing ----------
  const VIEWS=["feed","newsletters","saved","ideas","sources"];
  function route(){
    const v=(location.hash||"").slice(1);
    S.view=VIEWS.includes(v)?v:"feed"; S.confirm=null; S.formErr=""; S.shown=CHUNK; S.folder=null; S.folderMode=null;
    if(S.sheet) closeSheet();
    if(S.reader) closeReader();
    if(S.areader) closeArticle();
    if(S.isheet) closeIdeaSheet();
    if(S.ideaEdit) closeIdea(true);
    render(); window.scrollTo({top:0});
  }
  window.addEventListener("hashchange",route);

  // ---------- data ----------
  document.getElementById("stamp").addEventListener("click",()=>{ if(S.rsheet) return; openRefresh(); });
  async function boot(){
    route();
    let db=null;
    try{ db=window.claude&&window.claude.use?await window.claude.use("db"):null; }catch(e){db=null;}
    if(!db){S.dbState="none";render();return;}
    S.db=db; S.dbState="ok";
    const keys=Object.keys(S.loaded);
    const timer=setTimeout(()=>{S.stale=true;keys.forEach(k=>S.loaded[k]=true);render();},10000);
    const confirmed=new Set();
    const done=(k,snap)=>{S.loaded[k]=true;if(!snap.metadata.fromCache){confirmed.add(k);if(confirmed.size===keys.length){clearTimeout(timer);S.stale=false;}}};
    const fail=(k)=>()=>{clearTimeout(timer);S.loaded[k]=true;S.stale=true;render();};
    db.collection("sources").onSnapshot(snap=>{S.sources=new Map(snap.docs.map(d=>[d.id,d.data()]));done("sources",snap);render();},fail("sources"));
    db.collection("articles").orderBy("publishedAt","desc").limit(600).onSnapshot(snap=>{S.articles=snap.docs.map(d=>Object.assign({id:d.id},d.data()));done("articles",snap);render();},fail("articles"));
    db.collection("newsletters").orderBy("receivedAt","desc").limit(600).onSnapshot(snap=>{S.issues=snap.docs.map(d=>Object.assign({id:d.id},d.data()));done("issues",snap);render();},fail("issues"));
    db.collection("saved").onSnapshot(snap=>{S.saved=new Map(snap.docs.map(d=>{const v=d.data();return [d.id,Object.assign({itemId:v.itemId||v.articleId||d.id},v)];}));done("saved",snap);render();},fail("saved"));
    db.collection("folders").onSnapshot(snap=>{S.folders=new Map(snap.docs.map(d=>[d.id,d.data()]));done("folders",snap);render();},fail("folders"));
    db.doc("meta/feed").onSnapshot(snap=>{
      const was=S.meta&&S.meta.status; S.meta=snap.exists?snap.data():null; setStamp();
      if(was==="running"&&S.meta&&S.meta.status==="done"){
        const a=(S.meta.added&&S.meta.added.articles)||0, n=(S.meta.added&&S.meta.added.newsletters)||0;
        toast(a||n?"Refresh complete · "+a+" new article"+(a===1?"":"s")+", "+n+" new newsletter"+(n===1?"":"s"):"Refresh complete · nothing new since last time");
      }
      if(S.rsheet) renderRefreshSheet();
    },()=>{});
    db.collection("ideas").onSnapshot(snap=>{S.ideas=new Map(snap.docs.map(d=>[d.id,d.data()]));done("ideas",snap);render();},fail("ideas"));
    db.collection("ideaTypes").onSnapshot(snap=>{S.ideaTypes=new Map(snap.docs.map(d=>[d.id,d.data()]));done("ideaTypes",snap);render();},fail("ideaTypes"));
    db.collection("reads").onSnapshot(snap=>{S.reads=new Map(snap.docs.map(d=>[d.id,d.data()]));render();},()=>{});
    db.doc("meta/read").onSnapshot(snap=>{S.readMark=snap.exists?Object.assign({},snap.data()):{};render();},()=>{});
  }
  boot();
})();
</script>
